<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Enviando imagen…</title></head>
<body style="font-family:sans-serif;padding:20px">Enviando imagen a Facebook…
<script>
// Ayudante para publicar en Marketplace: envía imágenes del propio sitio (solo /img/repuestos/) a la pestaña de Facebook que abrió esta ventana.
(async () => {
  const names = new URLSearchParams(location.search).getAll("f").filter((n) => /^[\w.-]+\.(jpe?g|png|webp)$/i.test(n));
  if (!window.opener || !names.length) { document.body.textContent = "Nada que enviar."; return; }
  const files = [];
  for (const n of names) {
    const r = await fetch("/img/repuestos/" + n);
    if (r.ok) files.push({ name: n, blob: await r.blob() });
  }
  window.opener.postMessage({ apcImgs: files }, "https://www.facebook.com");
  document.body.textContent = "Listo (" + files.length + ")";
  setTimeout(() => window.close(), 800);
})();
</script></body></html>
