<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard | Admin Desarmaduría Saravia</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/img/favicon.png">
<link rel="stylesheet" href="/styles.css?v=20260902cart">
<style>
body{background:#f4f6f8;}
.admin-topbar{background:#111;color:#fff;padding:1rem 1.2rem;display:flex;justify-content:space-between;align-items:center;}
.admin-topbar a{color:#fff;text-decoration:none;font-weight:700;}
.admin-topbar button{background:transparent;border:1px solid #555;color:#ccc;padding:.4rem .9rem;border-radius:8px;cursor:pointer;}
.admin-wrap{max-width:960px;margin:2rem auto;padding:0 1rem;}
.admin-nav{display:flex;gap:.8rem;margin-bottom:1.5rem;flex-wrap:wrap;}
.admin-nav a{background:#fff;border:1.5px solid #ddd;border-radius:9px;padding:.6rem 1.1rem;text-decoration:none;color:#111;font-weight:700;font-size:.9rem;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;}
.stat-card{background:#fff;border-radius:12px;padding:1.2rem;box-shadow:0 2px 10px rgba(0,0,0,.06);}
.stat-card .num{font-size:1.8rem;font-weight:800;color:var(--red);}
.stat-card .label{font-size:.85rem;color:#666;margin-top:.2rem;}
</style>
</head>
<body>
<div class="admin-topbar">
<a href="/admin/index.html">Panel Desarmaduría Saravia</a>
<button id="logoutBtn">Cerrar sesión</button>
</div>
<div class="admin-wrap">
<div class="admin-nav">
<a href="/admin/index.html">Dashboard</a>
<a href="/admin/productos.html">Productos</a>
<a href="/admin/producto.html">+ Nuevo producto</a>
<a href="/catalogo.html" target="_blank">Ver catálogo público ↗</a>
</div>
<div class="stats-grid" id="stats">
<div class="stat-card"><div class="num">…</div><div class="label">Cargando</div></div>
</div>
</div>
<script type="module">
import { supabase, requireAdmin } from '/admin/admin-common.js';

document.getElementById('logoutBtn').addEventListener('click', async function(){
  await supabase.auth.signOut();
  location.href = '/admin/login.html';
});

(async function(){
  var session = await requireAdmin();
  if (!session) return;

  var [{ count: total }, { count: published }, { count: draft }, { count: noStock }] = await Promise.all([
    supabase.from('products').select('*', { count: 'exact', head: true }),
    supabase.from('products').select('*', { count: 'exact', head: true }).eq('is_active', true),
    supabase.from('products').select('*', { count: 'exact', head: true }).eq('is_active', false),
    supabase.from('products').select('*', { count: 'exact', head: true }).eq('is_active', true).lte('stock', 0),
  ]);

  document.getElementById('stats').innerHTML =
    '<div class="stat-card"><div class="num">' + (total||0) + '</div><div class="label">Productos totales</div></div>' +
    '<div class="stat-card"><div class="num">' + (published||0) + '</div><div class="label">Publicados</div></div>' +
    '<div class="stat-card"><div class="num">' + (draft||0) + '</div><div class="label">Borradores</div></div>' +
    '<div class="stat-card"><div class="num">' + (noStock||0) + '</div><div class="label">Publicados sin stock</div></div>';
})();
</script>
</body>
</html>
