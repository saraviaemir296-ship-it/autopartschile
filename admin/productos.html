<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Productos | Admin Desarmaduría Saravia</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/img/favicon.png">
<link rel="stylesheet" href="/styles.css?v=20260902cart">
<style>
body{background:#f4f6f8;}
.admin-topbar{background:#111;color:#fff;padding:1rem 1.2rem;display:flex;justify-content:space-between;align-items:center;}
.admin-topbar a{color:#fff;text-decoration:none;font-weight:700;}
.admin-topbar button{background:transparent;border:1px solid #555;color:#ccc;padding:.4rem .9rem;border-radius:8px;cursor:pointer;}
.admin-wrap{max-width:1100px;margin:2rem auto;padding:0 1rem;}
.admin-nav{display:flex;gap:.8rem;margin-bottom:1.2rem;flex-wrap:wrap;}
.admin-nav a{background:#fff;border:1.5px solid #ddd;border-radius:9px;padding:.6rem 1.1rem;text-decoration:none;color:#111;font-weight:700;font-size:.9rem;}
.toolbar{display:flex;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center;}
.toolbar input[type=text]{flex:1;min-width:200px;padding:.7rem .9rem;border:1.5px solid #ddd;border-radius:8px;}
.toolbar label{display:flex;align-items:center;gap:.4rem;font-size:.85rem;font-weight:700;color:#555;white-space:nowrap;background:#fff;border:1.5px solid #ddd;border-radius:8px;padding:.55rem .9rem;cursor:pointer;}
.toolbar label input{width:auto;}
.summary-bar{font-size:.82rem;color:#777;margin:-.4rem 0 .9rem;}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);}
th,td{padding:.7rem .8rem;text-align:left;font-size:.88rem;border-bottom:1px solid #eee;}
th{background:#f8f8f8;font-weight:700;color:#555;}
.badge{padding:.2rem .6rem;border-radius:12px;font-size:.78rem;font-weight:700;}
.badge.pub{background:#e8f9ee;color:#16a34a;}
.badge.draft{background:#eee;color:#777;}
.badge.nostock{background:#fdeaea;color:#c0392b;}
.badge.complete{background:#e8f9ee;color:#16a34a;}
.badge.incomplete{background:#fff4e0;color:#b8790a;cursor:help;}
.row-actions{display:flex;gap:.4rem;flex-wrap:wrap;}
.row-actions a,.row-actions button{font-size:.82rem;text-decoration:none;color:var(--red);background:none;border:none;cursor:pointer;font-weight:700;padding:0;}
.row-actions button.del{color:#c0392b;}
img.thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:.5rem;}

/* --- Vista de tarjetas en móvil (evita zoom y tablas imposibles de usar) --- */
@media (max-width: 720px) {
  table, thead, tbody, th, td, tr { display: block; }
  thead { display: none; }
  table { background: transparent; box-shadow: none; }
  tbody tr {
    background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.07);
    margin-bottom: 1rem; padding: 1rem; border-bottom: none;
  }
  tr td { border-bottom: none; padding: .35rem 0; display: flex; justify-content: space-between; align-items: center; gap: .6rem; }
  td[data-label]::before { content: attr(data-label); font-weight: 700; color: #888; font-size: .76rem; text-transform: uppercase; flex-shrink: 0; }
  td.cell-photo { justify-content: center; padding-bottom: .6rem; }
  td.cell-photo::before { content: none; }
  td.cell-photo img.thumb { width: 84px; height: 84px; margin: 0; }
  td.cell-actions { flex-direction: column; align-items: stretch; padding-top: .7rem; border-top: 1px solid #eee; margin-top: .4rem; }
  td.cell-actions::before { content: none; }
  .row-actions { width: 100%; flex-direction: column; }
  .row-actions a, .row-actions button {
    background: #f4f6f8; border-radius: 9px; padding: .75rem; text-align: center; font-size: .92rem;
  }
  .row-actions button.del { background: #fdeaea; }
}
</style>
</head>
<body>
<div class="admin-topbar">
<a href="/admin/index.html">Panel Desarmaduría Saravia</a>
<button id="logoutBtn">Cerrar sesión</button>
</div>
<div class="admin-wrap">
<div class="admin-nav">
<a href="/admin/index.html">Dashboard</a>
<a href="/admin/productos.html">Productos</a>
<a href="/admin/producto.html">+ Nuevo producto</a>
<a href="/admin/papelera.html">🗑 Papelera</a>
  <a href="/admin/vehiculos.html">Vehículos</a>
  <a href="/admin/vehiculo.html">+ Nuevo vehículo</a>
<a href="/catalogo.html" target="_blank">Ver catálogo público ↗</a>
</div>
<div class="toolbar">
<input type="text" id="q" placeholder="Buscar por nombre, SKU o marca...">
<label><input type="checkbox" id="onlyIncomplete"> Solo incompletos</label>
</div>
<p class="summary-bar" id="summaryBar"></p>
<table>
<thead><tr><th></th><th>Nombre</th><th>SKU</th><th>Marca</th><th>Precio</th><th>Stock</th><th>Estado</th><th>Completitud</th><th>Acciones</th></tr></thead>
<tbody id="rows"><tr><td colspan="9">Cargando...</td></tr></tbody>
</table>
</div>
<script type="module">
import { supabase, requireAdmin, money, toast, confirmModal } from '/admin/admin-common.js';

var all = [];
var currentSession = null;

function esc(s) { return (s == null ? '' : String(s)).replace(/"/g, '&quot;'); }

function getMissingFields(p) {
  var missing = [];
  if (!Array.isArray(p.images) || p.images.length === 0) missing.push('Fotos');
  if (!p.name || !String(p.name).trim()) missing.push('Nombre');
  if (!p.description || !String(p.description).trim()) missing.push('Descripción');
  if (!p.sku || !String(p.sku).trim()) missing.push('SKU');
  if (!p.oem_number || !String(p.oem_number).trim()) missing.push('OEM');
  if (!p.brand || !String(p.brand).trim()) missing.push('Marca');
  if (!p.category || !String(p.category).trim()) missing.push('Categoría');
  if (!p.vehicle_compatibility || !String(p.vehicle_compatibility).trim()) missing.push('Compatibilidad');
  if (!p.slug || !String(p.slug).trim()) missing.push('Slug URL');
  if (!p.seo_title || !String(p.seo_title).trim()) missing.push('SEO title');
  if (!p.meta_description || !String(p.meta_description).trim()) missing.push('Meta description');
  return missing;
}

function render(list) {
  var tbody = document.getElementById('rows');
  if (!list.length) { tbody.innerHTML = '<tr><td colspan="9">Sin resultados.</td></tr>'; return; }
  tbody.innerHTML = list.map(function(p){
    var img = (Array.isArray(p.images) && p.images.length) ? p.images[0] : '/img/favicon.png';
    var statusBadge = p.is_active
      ? (p.stock > 0 ? '<span class="badge pub">Publicado</span>' : '<span class="badge nostock">Publicado · sin stock</span>')
      : '<span class="badge draft">Borrador</span>';
    var missing = getMissingFields(p);
    var completBadge = missing.length === 0
      ? '<span class="badge complete">✓ Completo</span>'
      : '<span class="badge incomplete" title="Falta: ' + esc(missing.join(', ')) + '">⚠ ' + missing.length + ' faltante' + (missing.length > 1 ? 's' : '') + '</span>';
    return '<tr>' +
      '<td class="cell-photo"><img class="thumb" src="' + img + '" alt=""></td>' +
      '<td data-label="Nombre">' + esc(p.name) + '</td>' +
      '<td data-label="SKU">' + esc(p.sku) + '</td>' +
      '<td data-label="Marca">' + esc(p.brand||'') + '</td>' +
      '<td data-label="Precio">' + money(p.price_sale) + '</td>' +
      '<td data-label="Stock">' + p.stock + '</td>' +
      '<td data-label="Estado">' + statusBadge + '</td>' +
      '<td data-label="Completitud">' + completBadge + '</td>' +
      '<td class="cell-actions row-actions">' +
        '<a href="/admin/producto.html?id=' + p.id + '">Editar</a>' +
        '<button data-toggle="' + p.id + '" data-active="' + p.is_active + '">' + (p.is_active ? 'Despublicar' : 'Publicar') + '</button>' +
        '<button class="del" data-delete="' + p.id + '" data-name="' + esc(p.name) + '">Eliminar</button>' +
      '</td>' +
    '</tr>';
  }).join('');

  tbody.querySelectorAll('button[data-toggle]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      var id = btn.dataset.toggle;
      var current = btn.dataset.active === 'true';
      btn.disabled = true;
      var { error } = await supabase.from('products').update({ is_active: !current }).eq('id', id);
      if (error) { toast('No se pudo actualizar: ' + error.message, 'err'); btn.disabled = false; return; }
      toast(current ? 'Producto despublicado.' : 'Producto publicado.', 'ok');
      await load();
    });
  });

  tbody.querySelectorAll('button[data-delete]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      var id = btn.dataset.delete;
      var name = btn.dataset.name;
      var ok = await confirmModal({
        title: '¿Seguro que deseas eliminar esta publicación?',
        productName: name,
        warning: 'Esta publicación será enviada a la papelera y dejará de mostrarse en el sitio. Puedes restaurarla después desde Papelera.',
        confirmText: 'Eliminar',
        cancelText: 'Cancelar',
        danger: true,
      });
      if (!ok) return;
      var { error } = await supabase.from('products').update({
        is_active: false,
        deleted_at: new Date().toISOString(),
        deleted_by: currentSession ? currentSession.user.id : null,
      }).eq('id', id);
      if (error) { toast('No se pudo eliminar: ' + error.message, 'err'); return; }
      toast('Producto eliminado correctamente.', 'ok');
      await load();
    });
  });
}

function applyFilters() {
  var q = document.getElementById('q').value.trim().toLowerCase();
  var onlyInc = document.getElementById('onlyIncomplete').checked;
  var filtered = all.filter(function(p){
    var matchesQ = !q ||
      (p.name||'').toLowerCase().indexOf(q) !== -1 ||
      (p.sku||'').toLowerCase().indexOf(q) !== -1 ||
      (p.brand||'').toLowerCase().indexOf(q) !== -1;
    var matchesInc = !onlyInc || getMissingFields(p).length > 0;
    return matchesQ && matchesInc;
  });
  render(filtered);
  var totalIncomplete = all.filter(function(p){ return getMissingFields(p).length > 0; }).length;
  document.getElementById('summaryBar').textContent = all.length + ' producto(s) en total · ' + totalIncomplete + ' con datos incompletos.';
}

async function load() {
  var { data, error } = await supabase.from('products').select('*').is('deleted_at', null).order('updated_at', { ascending: false });
  if (error) { document.getElementById('rows').innerHTML = '<tr><td colspan="9">Error: ' + error.message + '</td></tr>'; return; }
  all = data || [];
  applyFilters();
}

document.getElementById('q').addEventListener('input', applyFilters);
document.getElementById('onlyIncomplete').addEventListener('change', applyFilters);

document.getElementById('logoutBtn').addEventListener('click', async function(){
  await supabase.auth.signOut();
  location.href = '/admin/login.html';
});

(async function(){
  var session = await requireAdmin();
  if (!session) return;
  currentSession = session;
  await load();
})();
</script>
</body>
</html>
