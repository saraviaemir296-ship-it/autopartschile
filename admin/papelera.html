<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Papelera | Admin Desarmaduría Saravia</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/img/favicon.png">
<link rel="stylesheet" href="/styles.css?v=20260902cart">
<style>
body{background:#f4f6f8;}
.admin-topbar{background:#111;color:#fff;padding:1rem 1.2rem;display:flex;justify-content:space-between;align-items:center;}
.admin-topbar a{color:#fff;text-decoration:none;font-weight:700;}
.admin-topbar button{background:transparent;border:1px solid #555;color:#ccc;padding:.4rem .9rem;border-radius:8px;cursor:pointer;}
.admin-wrap{max-width:1100px;margin:2rem auto;padding:0 1rem;}
.admin-nav{display:flex;gap:.8rem;margin-bottom:1.2rem;flex-wrap:wrap;}
.admin-nav a{background:#fff;border:1.5px solid #ddd;border-radius:9px;padding:.6rem 1.1rem;text-decoration:none;color:#111;font-weight:700;font-size:.9rem;}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);}
th,td{padding:.7rem .8rem;text-align:left;font-size:.88rem;border-bottom:1px solid #eee;}
th{background:#f8f8f8;font-weight:700;color:#555;}
.row-actions{display:flex;gap:.4rem;flex-wrap:wrap;}
.row-actions button{font-size:.82rem;background:none;border:none;cursor:pointer;font-weight:700;padding:0;}
.row-actions button.restore{color:#16a34a;}
.row-actions button.purge{color:#c0392b;}
img.thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:.5rem;}
.empty-msg{background:#fff;border-radius:10px;padding:2rem;text-align:center;color:#777;}

@media (max-width: 720px) {
  table, thead, tbody, th, td, tr { display: block; }
  thead { display: none; }
  table { background: transparent; box-shadow: none; }
  tbody tr {
    background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.07);
    margin-bottom: 1rem; padding: 1rem; border-bottom: none;
  }
  tr td { border-bottom: none; padding: .35rem 0; display: flex; justify-content: space-between; align-items: center; gap: .6rem; }
  td[data-label]::before { content: attr(data-label); font-weight: 700; color: #888; font-size: .76rem; text-transform: uppercase; flex-shrink: 0; }
  td.cell-photo { justify-content: center; padding-bottom: .6rem; }
  td.cell-photo::before { content: none; }
  td.cell-photo img.thumb { width: 84px; height: 84px; margin: 0; }
  td.cell-actions { flex-direction: column; align-items: stretch; padding-top: .7rem; border-top: 1px solid #eee; margin-top: .4rem; }
  td.cell-actions::before { content: none; }
  .row-actions { width: 100%; flex-direction: column; }
  .row-actions button { background: #f4f6f8; border-radius: 9px; padding: .75rem; text-align: center; font-size: .92rem; }
  .row-actions button.purge { background: #fdeaea; }
  .row-actions button.restore { background: #e8f9ee; }
}
</style>
</head>
<body>
<div class="admin-topbar">
<a href="/admin/index.html">Panel Desarmaduría Saravia</a>
<button id="logoutBtn">Cerrar sesión</button>
</div>
<div class="admin-wrap">
<div class="admin-nav">
<a href="/admin/index.html">Dashboard</a>
<a href="/admin/productos.html">Productos</a>
<a href="/admin/producto.html">+ Nuevo producto</a>
<a href="/admin/papelera.html">🗑 Papelera</a>
  <a href="/admin/vehiculos.html">Vehículos</a>
</div>
<p style="font-size:.85rem;color:#777;margin-bottom:1rem;">Productos eliminados desde Productos. Puedes restaurarlos o eliminarlos definitivamente (esto último no se puede deshacer).</p>
<table>
<thead><tr><th></th><th>Nombre</th><th>SKU</th><th>Eliminado el</th><th>Acciones</th></tr></thead>
<tbody id="rows"><tr><td colspan="5">Cargando...</td></tr></tbody>
</table>
</div>
<script type="module">
import { supabase, requireAdmin, confirmModal, toast } from '/admin/admin-common.js';

function esc(s) { return (s == null ? '' : String(s)).replace(/"/g, '&quot;'); }

function formatDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  return d.toLocaleDateString('es-CL') + ' ' + d.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
}

function render(list) {
  var tbody = document.getElementById('rows');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="5"><div class="empty-msg">La papelera está vacía.</div></td></tr>';
    return;
  }
  tbody.innerHTML = list.map(function(p){
    var img = (Array.isArray(p.images) && p.images.length) ? p.images[0] : '/img/favicon.png';
    return '<tr>' +
      '<td class="cell-photo"><img class="thumb" src="' + img + '" alt=""></td>' +
      '<td data-label="Nombre">' + esc(p.name) + '</td>' +
      '<td data-label="SKU">' + esc(p.sku) + '</td>' +
      '<td data-label="Eliminado el">' + formatDate(p.deleted_at) + '</td>' +
      '<td class="cell-actions row-actions">' +
        '<button class="restore" data-restore="' + p.id + '">Restaurar</button>' +
        '<button class="purge" data-purge="' + p.id + '" data-name="' + esc(p.name) + '">Eliminar definitivamente</button>' +
      '</td>' +
    '</tr>';
  }).join('');

  tbody.querySelectorAll('button[data-restore]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      var id = btn.dataset.restore;
      btn.disabled = true;
      var { error } = await supabase.from('products').update({
        deleted_at: null,
        deleted_by: null,
        is_active: true,
      }).eq('id', id);
      if (error) { toast('No se pudo restaurar: ' + error.message, 'err'); btn.disabled = false; return; }
      toast('Producto restaurado correctamente.', 'ok');
      await load();
    });
  });

  tbody.querySelectorAll('button[data-purge]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      var id = btn.dataset.purge;
      var name = btn.dataset.name;
      var ok = await confirmModal({
        title: 'Eliminar definitivamente',
        productName: name,
        warning: 'Esta acción NO se puede deshacer. El producto y sus datos se borrarán para siempre de la base de datos.',
        confirmText: 'Sí, eliminar para siempre',
        cancelText: 'Cancelar',
        danger: true,
      });
      if (!ok) return;
      var ok2 = await confirmModal({
        title: '¿Estás completamente seguro?',
        productName: name,
        warning: 'Última confirmación: esto borra el producto por completo, sin posibilidad de restaurarlo después.',
        confirmText: 'Eliminar para siempre',
        cancelText: 'Cancelar',
        danger: true,
      });
      if (!ok2) return;
      var { error } = await supabase.from('products').delete().eq('id', id);
      if (error) { toast('No se pudo eliminar definitivamente: ' + error.message, 'err'); return; }
      toast('Producto eliminado definitivamente.', 'ok');
      await load();
    });
  });
}

async function load() {
  var { data, error } = await supabase.from('products').select('*').not('deleted_at', 'is', null).order('deleted_at', { ascending: false });
  if (error) { document.getElementById('rows').innerHTML = '<tr><td colspan="5">Error: ' + error.message + '</td></tr>'; return; }
  render(data || []);
}

document.getElementById('logoutBtn').addEventListener('click', async function(){
  await supabase.auth.signOut();
  location.href = '/admin/login.html';
});

(async function(){
  var session = await requireAdmin();
  if (!session) return;
  await load();
})();
</script>
</body>
</html>
