<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Configurar contraseña | Admin Desarmaduría Saravia</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/img/favicon.png">
<link rel="stylesheet" href="/styles.css?v=20260902cart">
<style>
body{background:#f4f6f8;}
.admin-wrap{max-width:380px;margin:4rem auto;padding:0 1rem;}
.admin-card{background:#fff;border-radius:14px;padding:2rem 1.5rem;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.admin-card h1{font-size:1.2rem;margin:0 0 .5rem;text-align:center;}
.admin-card p.hint{font-size:.85rem;color:#777;text-align:center;margin-bottom:1.2rem;}
label{display:block;font-size:.85rem;font-weight:700;margin:1rem 0 .4rem;color:#333;}
input{width:100%;padding:.75rem .8rem;border:1.5px solid #ddd;border-radius:8px;font-size:1rem;}
button{width:100%;margin-top:1.5rem;background:var(--red);color:#fff;border:none;padding:.9rem;border-radius:9px;font-size:1rem;font-weight:800;cursor:pointer;}
button:disabled{opacity:.6;}
.msg{margin-top:1rem;padding:.7rem;border-radius:8px;font-size:.88rem;text-align:center;display:none;}
.msg.err{display:block;background:#fdeaea;color:#c0392b;}
.msg.ok{display:block;background:#e8f9ee;color:#16a34a;}
</style>
</head>
<body>
<div class="admin-wrap">
<div class="admin-card">
<h1>Configura tu contraseña</h1>
<p class="hint">Este enlace es de un solo uso. Elige tu contraseña definitiva para el panel de administración.</p>
<form id="pwForm">
<label for="password">Nueva contraseña</label>
<input type="password" id="password" required minlength="8" autocomplete="new-password">
<label for="password2">Repite la contraseña</label>
<input type="password" id="password2" required minlength="8" autocomplete="new-password">
<button type="submit" id="btn">Guardar contraseña</button>
<p class="msg" id="msg"></p>
</form>
</div>
</div>
<script type="module">
import { supabase } from '/admin/admin-common.js';

// El SDK de Supabase detecta automáticamente el token de recuperación en el hash
// de la URL (#access_token=...) y crea una sesión temporal para poder llamar
// a updateUser({password}) — el usuario nunca ve ni maneja el token.
var msg = document.getElementById('msg');

document.getElementById('pwForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var p1 = document.getElementById('password').value;
  var p2 = document.getElementById('password2').value;
  msg.className = 'msg';
  if (p1 !== p2) {
    msg.textContent = 'Las contraseñas no coinciden.';
    msg.className = 'msg err';
    return;
  }
  var btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = 'Guardando...';

  var { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    msg.textContent = 'Este enlace ya expiró o ya fue usado. Pide uno nuevo.';
    msg.className = 'msg err';
    btn.disabled = false; btn.textContent = 'Guardar contraseña';
    return;
  }

  var { error } = await supabase.auth.updateUser({ password: p1 });
  if (error) {
    msg.textContent = 'No se pudo guardar: ' + error.message;
    msg.className = 'msg err';
    btn.disabled = false; btn.textContent = 'Guardar contraseña';
    return;
  }

  msg.textContent = '¡Listo! Redirigiendo al panel...';
  msg.className = 'msg ok';
  setTimeout(function(){ location.href = '/admin/index.html'; }, 1200);
});
</script>
</body>
</html>
