<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingresar | Admin Desarmaduría Saravia</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/img/favicon.png">
<link rel="stylesheet" href="/styles.css?v=20260902cart">
<style>
body{background:#f4f6f8;}
.admin-wrap{max-width:380px;margin:4rem auto;padding:0 1rem;}
.admin-card{background:#fff;border-radius:14px;padding:2rem 1.5rem;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.admin-card h1{font-size:1.3rem;margin:0 0 1.2rem;text-align:center;}
label{display:block;font-size:.85rem;font-weight:700;margin:1rem 0 .4rem;color:#333;}
input{width:100%;padding:.75rem .8rem;border:1.5px solid #ddd;border-radius:8px;font-size:1rem;}
button{width:100%;margin-top:1.5rem;background:var(--red);color:#fff;border:none;padding:.9rem;border-radius:9px;font-size:1rem;font-weight:800;cursor:pointer;}
button:disabled{opacity:.6;}
.msg{margin-top:1rem;padding:.7rem;border-radius:8px;font-size:.88rem;text-align:center;display:none;}
.msg.err{display:block;background:#fdeaea;color:#c0392b;}
</style>
</head>
<body>
<div class="admin-wrap">
<div class="admin-card">
<h1>Panel de administración</h1>
<form id="loginForm">
<label for="email">Correo</label>
<input type="email" id="email" required autocomplete="username">
<label for="password">Contraseña</label>
<input type="password" id="password" required autocomplete="current-password">
<button type="submit" id="btn">Ingresar</button>
<p class="msg" id="msg"></p>
</form>
</div>
</div>
<script type="module">
import { supabase } from '/admin/admin-common.js';

var params = new URLSearchParams(location.search);
var msg = document.getElementById('msg');
if (params.get('error') === 'no_autorizado') {
  msg.textContent = 'Esta cuenta no tiene permisos de administrador.';
  msg.className = 'msg err';
}

// Si ya hay sesión válida de admin, saltar directo al dashboard.
(async function(){
  var { data: { session } } = await supabase.auth.getSession();
  if (session) {
    var { data: row } = await supabase.from('admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
    if (row) { location.href = '/admin/index.html'; }
  }
})();

document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = 'Ingresando...';
  msg.className = 'msg';

  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;

  var { data, error } = await supabase.auth.signInWithPassword({ email: email, password: password });
  if (error || !data.session) {
    msg.textContent = 'Correo o contraseña incorrectos.';
    msg.className = 'msg err';
    btn.disabled = false; btn.textContent = 'Ingresar';
    return;
  }

  var { data: adminRow } = await supabase.from('admins').select('user_id').eq('user_id', data.session.user.id).maybeSingle();
  if (!adminRow) {
    await supabase.auth.signOut();
    msg.textContent = 'Esta cuenta no tiene permisos de administrador.';
    msg.className = 'msg err';
    btn.disabled = false; btn.textContent = 'Ingresar';
    return;
  }

  location.href = '/admin/index.html';
});
</script>
</body>
</html>
