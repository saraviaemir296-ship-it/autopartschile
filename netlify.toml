# AutopartsChile — Netlify configuration

[build]
  publish = "."
  functions = "netlify/functions"

# Redirige /api/google-reviews → /.netlify/functions/google-reviews (URL limpia)
[[redirects]]
  from = "/api/google-reviews"
  to = "/.netlify/functions/google-reviews"
  status = 200

# feed.xml (Google Shopping) ahora se genera en vivo desde Supabase — antes era
# un archivo estático de 114 items mantenido a mano, desconectado de los 270+
# productos reales. 'force = true' porque sin él Netlify serviría el archivo
# estático si existiera en vez de aplicar el redirect (mismo motivo que la regla
# de /*.html más abajo).
[[redirects]]
  from = "/feed.xml"
  to = "/.netlify/functions/feed"
  status = 200
  force = true

# Unifica la convención de URLs: toda pagina.html redirige 301 a /pagina (URL limpia),
# que es la que usa toda la navegación interna del sitio (menú, footer, cards).
# 'force = true' es necesario porque sin él Netlify prioriza servir el archivo
# estático existente en vez de aplicar el redirect. Sin esta regla, /pagina.html
# y /pagina podían quedar como dos URLs cacheadas por separado sirviendo
# contenido desincronizado entre sí (confirmado en catalogo.html vs catalogo).
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

# Security headers globales
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # CSP activo (ya no Report-Only). Verificado sin violaciones en consola en
    # homepage, catalogo.html y una pagina de producto con checkout.js activo
    # antes de activarlo. Basado en un inventario real de los recursos externos
    # que carga el sitio (Google Analytics, Supabase, ipapi.co, Transbank/Webpay).
    # No incluye 'nonce' porque el sitio usa scripts inline sin build step — por
    # eso lleva 'unsafe-inline' en script-src, lo cual limita cuanto protege
    # contra XSS. Si se agregan nuevos recursos externos al sitio, hay que
    # sumarlos aqui o se bloquearan.
    # img-src incluye Supabase Storage porque catalogo.html y producto.html ahora
    # muestran fotos de productos subidas desde /admin/ (bucket product-images).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://zlyforhywunqhitrdreo.supabase.co https://ipapi.co https://www.google-analytics.com https://www.googletagmanager.com https://region1.google-analytics.com; img-src 'self' data: https://www.google-analytics.com https://zlyforhywunqhitrdreo.supabase.co; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://webpay3gint.transbank.cl https://webpay3g.transbank.cl"

# CSP propia para /admin/: el panel carga el cliente de Supabase como módulo ES
# desde esm.sh (no hay build step que lo empaquete localmente). No se relaja la
# CSP del sitio público para esto — solo aplica bajo /admin/*. Además nunca se
# indexa (X-Robots-Tag + robots.txt), y el propio backend (RLS + Supabase Auth)
# es quien autoriza de verdad, no esta cabecera.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh; connect-src 'self' https://zlyforhywunqhitrdreo.supabase.co https://esm.sh; img-src 'self' data: https://zlyforhywunqhitrdreo.supabase.co; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"

# Cache agresivo para assets estáticos
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
